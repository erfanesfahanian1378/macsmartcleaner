name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: check shell scripts
        run: sh -n install.sh && sh -n msc
      - name: smoke test real scan
        run: |
          ./msc scan --report --no-discover --no-projects
          ./msc clean --dry-run
          ./msc smart --dry-run
          ./msc status --once
          ./msc optimize --list
          ./msc uninstall --list | head -20
          ./msc lens ~ --list --top 15
      - name: macOS diagnostics (real system output, for review)
        if: runner.os == 'macOS'
        run: |
          python -m unittest tests.test_macos_live -v
          time ./msc scan --report --min-size 0 --no-projects --hog-min 200MB
          ./msc clean --dry-run --tier caution
          ./msc uninstall --dry-run "$(./msc uninstall --list | head -1 | cut -c 23-54 | xargs)" || true
