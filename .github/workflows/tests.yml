name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: check shell scripts
        run: sh -n install.sh && sh -n msc
      - name: install links in the README resolve
        run: |
          for url in $(grep -oE 'https://raw\.githubusercontent\.com/[^ `]+' README.md install.sh | cut -d: -f2- | sort -u); do
            echo "checking $url"; curl -fsSIL "$url" >/dev/null || { echo "broken link: $url"; exit 1; }
          done
      - name: public one-line install, as a new user would (macOS)
        if: runner.os == 'macOS'
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          H="$(mktemp -d)"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$REF/install.sh" | HOME="$H" SHELL=/bin/zsh MSC_REF="$REF" sh
          HOME="$H" zsh -ic 'command -v msc && msc --version && msc guard status'
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$REF/install.sh" | HOME="$H" sh -s -- --uninstall
          if grep -q macsmartcleaner "$H/.zshrc"; then echo "PATH line left behind"; exit 1; fi
          test ! -e "$H/.local/bin/msc"
      - name: smoke test real scan
        run: |
          ./msc scan --report --no-discover --no-projects
          ./msc clean --dry-run
          ./msc smart --dry-run
          ./msc status --once
          ./msc optimize --list
          ./msc uninstall --list | head -20
          ./msc lens ~ --list --top 15
      - name: macOS diagnostics (real system output, for review)
        if: runner.os == 'macOS'
        run: |
          python -m unittest tests.test_macos_live -v
          time ./msc scan --report --min-size 0 --no-projects --hog-min 200MB
          ./msc clean --dry-run --tier caution
          ./msc uninstall --dry-run "$(./msc uninstall --list | head -1 | cut -c 23-54 | xargs)" || true
      - name: macOS admin checks (runner has passwordless sudo)
        if: runner.os == 'macOS'
        run: |
          sudo ./msc diagnose
          sudo ./msc spotlight --watch 10
          mkdir -p ~/msc-spotlight-test
          sudo ./msc spotlight --exclude ~/msc-spotlight-test
          sudo /usr/libexec/PlistBuddy -c "Print :Exclusions" /System/Volumes/Data/.Spotlight-V100/VolumeConfiguration.plist
          sudo ./msc spotlight --include ~/msc-spotlight-test
          sudo /usr/libexec/PlistBuddy -c "Print :Exclusions" /System/Volumes/Data/.Spotlight-V100/VolumeConfiguration.plist || true
          sudo ./msc spotlight --guard-check --max 1TB
          sudo ./msc guard on --index 20GB --min-free 10GB
          sudo launchctl print system/com.macsmartcleaner.guard | head -20
          sleep 5; ./msc guard status
          sudo ./msc guard check --dry-run
          sudo ./msc guard off
          if sudo launchctl print system/com.macsmartcleaner.guard >/dev/null 2>&1; then echo "guard still loaded"; exit 1; fi
          test ! -e /Library/LaunchDaemons/com.macsmartcleaner.guard.plist
          ./msc guard status
          mdutil -s /System/Volumes/Data
