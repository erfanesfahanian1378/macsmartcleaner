name: Bug report
description: Something went wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran and its output
      render: shell
  - type: input
    id: versions
    attributes:
      label: macOS version and `msc --version`
      placeholder: macOS 15.3, macsmartcleaner 0.1.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `msc doctor`
      render: shell
