[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macsmartcleaner"
version = "0.1.0"
description = "Find and safely clean what's inflating macOS 'System Data'"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = {text = "MIT"}
keywords = ["macos", "disk-space", "system-data", "cleaner", "cache", "storage", "xcode", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/erfanesfahanian1378/macsmartcleaner"
Issues = "https://github.com/erfanesfahanian1378/macsmartcleaner/issues"
Changelog = "https://github.com/erfanesfahanian1378/macsmartcleaner/blob/main/CHANGELOG.md"

[project.scripts]
msc = "macsmartcleaner.cli:main"

[tool.setuptools]
packages = ["macsmartcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
